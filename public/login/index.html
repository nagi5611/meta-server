<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metaverse Simple - 体験</title>
    <script src="/js/spawn-pending-storage.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .login-container {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 20px;
            border: 2px solid #0288d1;
            box-shadow: 0 4px 20px rgba(2, 136, 209, 0.15);
            max-width: 480px;
            width: 90%;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 32px;
            color: #0288d1;
            margin-bottom: 10px;
        }

        .login-header p {
            font-size: 14px;
            color: #666;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #0288d1;
            box-shadow: 0 0 0 3px rgba(2, 136, 209, 0.15);
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #fff;
            color: #0288d1;
            border: 2px solid #0288d1;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(2, 136, 209, 0.15);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            background: rgba(2, 136, 209, 0.08);
            box-shadow: 0 4px 12px rgba(2, 136, 209, 0.25);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .info-text {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }

        .login-links {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
        }

        .login-links a {
            color: #0288d1;
            text-decoration: none;
        }

        .login-links a:hover {
            text-decoration: underline;
        }

        .login-links span {
            margin: 0 8px;
            color: #ccc;
        }

        #login-avatar-mount {
            display: none;
            margin-bottom: 20px;
        }

        .login-avatar-heading {
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
        }

        .login-avatar-msg {
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
        }

        .login-avatar-choice-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
            max-height: 180px;
            overflow: auto;
        }

        .login-avatar-choice-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .login-avatar-preview-wrap {
            display: flex;
            justify-content: center;
            margin: 8px 0;
        }

        .login-avatar-canvas {
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            background: #fafafa;
            max-width: 100%;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Metaverse Simple</h1>
            <p>表示名を決めてメタバースに入れます（空欄の場合は自動で名前が付きます）</p>
        </div>

        <div id="login-avatar-mount" aria-live="polite"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">表示名</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="例: たろう（空欄でも体験できます）" 
                    autocomplete="off"
                    maxlength="20"
                >
                <div class="error-message" id="error-message">
                    表示名は2～20文字で入力してください
                </div>
            </div>

            <button type="submit" class="login-btn" id="login-btn">
                体験する
            </button>
        </form>

        <div class="info-text">
            同じ表示名でも複数人が入れます
        </div>

        <div class="login-links">
            <a href="/student/">生徒ログイン</a>
            <span>|</span>
            <a href="/teacher/">教師ログイン</a>
        </div>
    </div>

    <script>
        if (window.metaverseSpawnPending) {
            window.metaverseSpawnPending.captureSpawnFromUrl();
            window.metaverseSpawnPending.patchLoginLinks();
        }
        const hash = window.location.hash || '';
        const withSpawn = (path) =>
            window.metaverseSpawnPending
                ? window.metaverseSpawnPending.appendSpawnQuery(path) + hash
                : path + window.location.search + hash;

        // 既にログイン済みの場合は自動的にゲーム画面へ（admin は管理者専用のため除外）
        const savedUsername = localStorage.getItem('username');
        if (savedUsername && savedUsername.trim().length >= 2) {
            if (savedUsername.trim().toLowerCase() !== 'admin') {
                window.location.href = withSpawn('/index.html');
            } else {
                localStorage.removeItem('username');
                localStorage.removeItem('userRole');
            }
        }

        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');
        const loginBtn = document.getElementById('login-btn');
        const errorMessage = document.getElementById('error-message');
        const GUEST_LOGIN_MIN_INTERVAL_MS = 3000;
        let lastGuestLoginAttemptAt = 0;

        /**
         * 空欄時に割り当てる表示名（Guest0101 形式）
         * @returns {string}
         */
        function allocateGuestDisplayName() {
            const n = Math.floor(Math.random() * 10000);
            return `Guest${String(n).padStart(4, '0')}`;
        }

        /**
         * 表示名を保存してメタバースへ遷移する（認証演出付き）
         * @param {string} displayName
         * @param {() => Promise<void>} [authTask]
         */
        async function enterMetaverse(displayName, authTask) {
            if (!window.metaverseLoginEntry?.run) {
                localStorage.setItem('username', displayName);
                localStorage.removeItem('userRole');
                window.location.href = withSpawn('/index.html');
                return;
            }
            await window.metaverseLoginEntry.run({
                displayName,
                authTask: authTask || (async () => {}),
                redirectUrl: withSpawn('/index.html'),
            });
        }

        // フォーム送信処理
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (window.metaverseWorldPreload) {
                window.metaverseWorldPreload.start();
            }

            const raw = usernameInput.value.trim();
            const isAutoGuest = raw.length === 0;
            const username = isAutoGuest ? allocateGuestDisplayName() : raw;

            if (!isAutoGuest && (username.length < 2 || username.length > 20)) {
                errorMessage.textContent = '表示名は2～20文字で入力してください';
                errorMessage.style.display = 'block';
                usernameInput.focus();
                return;
            }
            if (username.toLowerCase() === 'admin') {
                errorMessage.textContent = '「admin」は管理者専用のため使用できません';
                errorMessage.style.display = 'block';
                usernameInput.focus();
                return;
            }

            const nowTs = Date.now();
            if (!isAutoGuest && nowTs - lastGuestLoginAttemptAt < GUEST_LOGIN_MIN_INTERVAL_MS) {
                errorMessage.textContent =
                    `前回の試行から${GUEST_LOGIN_MIN_INTERVAL_MS / 1000}秒以上お待ちください`;
                errorMessage.style.display = 'block';
                usernameInput.focus();
                return;
            }
            lastGuestLoginAttemptAt = nowTs;

            loginBtn.disabled = true;
            errorMessage.style.display = 'none';

            const persistGuest = () => {
                localStorage.setItem('username', username);
                localStorage.removeItem('userRole');
            };

            if (isAutoGuest) {
                await enterMetaverse(username, async () => {
                    persistGuest();
                });
                return;
            }

            await enterMetaverse(username, async () => {
                const res = await fetch('/api/auth/guest/username-moderate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username }),
                });
                const data = await res.json().catch(() => ({}));

                if (!res.ok || !data.ok) {
                    const msg =
                        (data && typeof data.message === 'string' && data.message.trim()) ||
                        (res.status === 429 ? '試行間隔が短すぎます。しばらくお待ちください。' : '入場できませんでした');
                    const err = new Error(msg);
                    err.displayMessage = msg;
                    throw err;
                }
                persistGuest();
            });
        });

        // 入力時にエラーメッセージを非表示
        usernameInput.addEventListener('input', () => {
            errorMessage.style.display = 'none';
        });

        // ページ読み込み時にフォーカス
        usernameInput.focus();
    </script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    <script type="module">
        import { mountLoginAvatarPicker } from '/js/login-avatar-picker.js';
        import { startLoginWorldPreload } from '/js/world-preload.js';
        import { runLoginEntryTransition } from '/js/login-entry-transition.js';

        const preloadStart = () => startLoginWorldPreload();
        window.metaverseWorldPreload = { start: preloadStart };
        preloadStart();

        window.metaverseLoginEntry = {
            run: ({ displayName, authTask, redirectUrl }) =>
                runLoginEntryTransition({
                    displayName,
                    theme: 'guest',
                    authTask,
                    redirectUrl,
                    preloadStart,
                    onAuthFailed: (err) => {
                        const msg =
                            (err && typeof err.displayMessage === 'string' && err.displayMessage) ||
                            (err instanceof Error && err.message) ||
                            '通信エラーが発生しました';
                        const errorMessage = document.getElementById('error-message');
                        const usernameInput = document.getElementById('username');
                        const loginBtn = document.getElementById('login-btn');
                        if (errorMessage) {
                            errorMessage.textContent = msg;
                            errorMessage.style.display = 'block';
                        }
                        usernameInput?.focus();
                        if (loginBtn) {
                            loginBtn.textContent = '体験する';
                            loginBtn.disabled = false;
                        }
                    },
                }),
        };

        const m = document.getElementById('login-avatar-mount');
        if (m) void mountLoginAvatarPicker(m);
    </script>
</body>

</html>
