<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metaverse Instance</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; overflow: hidden; background: #c8ecff; }
        #instance-overlay {
            position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.55); color: #fff; font-family: system-ui, sans-serif; padding: 1rem; text-align: center;
        }
        #instance-overlay.error { color: #ffb4b4; }
        #instance-desktop-hint {
            position: fixed; top: 0; left: 0; right: 0; z-index: 15;
            background: rgba(20,20,30,0.9); color: #ddd; font-size: 0.85rem;
            padding: 0.5rem 0.75rem; text-align: center;
        }
        #instance-start-guide {
            position: fixed; inset: 0; z-index: 25; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.72); padding: 1rem;
        }
        #instance-start-guide[hidden] { display: none !important; }
        .instance-start-guide-card {
            max-width: 22rem; width: 100%; background: #1e1e28; color: #f2f2f2;
            border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 1.25rem 1.1rem;
            font-family: system-ui, -apple-system, sans-serif; text-align: left;
            box-shadow: 0 8px 32px rgba(0,0,0,0.45);
        }
        .instance-start-guide-card h1 {
            margin: 0 0 0.75rem; font-size: 1.15rem; font-weight: 700; text-align: center;
        }
        .instance-start-guide-list {
            margin: 0 0 1rem; padding-left: 1.1rem; font-size: 0.92rem; line-height: 1.55;
        }
        .instance-start-guide-list li { margin-bottom: 0.45rem; }
        .instance-start-btn {
            display: block; width: 100%; border: none; border-radius: 8px; padding: 0.75rem 1rem;
            font-size: 1rem; font-weight: 600; background: #3d7eff; color: #fff; cursor: pointer;
        }
        .instance-start-btn:active { background: #2f68d4; }
    </style>
</head>

<body>
    <div id="instance-desktop-hint" hidden>マウスドラッグで視点を変えられます</div>
    <div id="instance-start-guide" hidden>
        <div class="instance-start-guide-card">
            <h1>3Dインスタンス</h1>
            <ul class="instance-start-guide-list">
                <li id="instance-guide-gyro" hidden>スマホを回転させると、ジャイロで視点が動きます</li>
                <li id="instance-guide-touch">画面をドラッグして視点を変えられます</li>
            </ul>
            <button type="button" id="instance-start-btn" class="instance-start-btn">体験を開始</button>
        </div>
    </div>
    <div id="instance-overlay" hidden></div>
    <a-scene
        renderer="antialias: false; colorManagement: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded
        style="width: 100%; height: 100%;">
        <a-sky color="#C8ECFF"></a-sky>
        <a-entity
            id="instance-camera"
            camera
            look-controls="magicWindowTrackingEnabled: false; touchEnabled: true; pointerLockEnabled: false"
            wasd-controls="enabled: false"
            position="0 1.6 4"></a-entity>
        <a-entity light="type: ambient; intensity: 0.6"></a-entity>
        <a-entity light="type: directional; intensity: 0.8" position="2 4 3"></a-entity>
    </a-scene>
    <script type="module" src="/addons/nfc-spawn/client/instance-viewer.js"></script>
</body>

</html>
