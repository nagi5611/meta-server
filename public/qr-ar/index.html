<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>QR-AR — Open WebAR SDK</title>
    <link rel="stylesheet" href="./ar.css" />
</head>
<body>
    <div id="qr-ar-start-guide" class="qr-ar-start-guide">
        <div class="qr-ar-start-card">
            <h1>QR-AR</h1>
            <p>カメラを起動し、印刷したマーカーを映してください。マーカーの上に 3D モデルが表示されます。</p>
            <p class="qr-ar-start-hint">
                推奨: 画像マーカー <code>public/qr-ar/assets/trigger.jpg</code> を印刷（斜め角度の追跡に強い）<br />
                代替: QR コード <code>public/qr-ar/assets/trigger.png</code> でも認識可能<br />
                マーカー非表示時は IMU で位置を維持します（スマホのみ・平行移動は補正不可）
            </p>
            <button type="button" id="qr-ar-start-btn" class="qr-ar-start-btn">AR を開始</button>
            <p id="qr-ar-error" class="qr-ar-error" hidden></p>
        </div>
    </div>
    <div id="qr-ar-mount" class="App" hidden></div>
    <div id="qr-ar-status" class="qr-ar-status" hidden>
        <span id="qr-ar-status-text">QR を探しています…</span>
    </div>
    <script type="module" src="./ar-app.js"></script>
</body>
</html>
