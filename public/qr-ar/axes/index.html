<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR 軸表示デモ (TemugeB)</title>
    <link rel="stylesheet" href="/addons/qr-ar/client/ar/ar.css">
</head>

<body class="qr-ar-axes-page">
    <div id="qr-ar-start-guide">
        <div class="qr-ar-start-card">
            <h1>QR XYZ 軸デモ</h1>
            <p class="qr-ar-lead">
                TemugeB の OpenCV solvePnP 手順をブラウザで再現します。QR を映すと
                <strong style="color:#ff3333">X</strong> /
                <strong style="color:#33ff33">Y</strong> /
                <strong style="color:#3399ff">Z</strong>
                軸が重ねて表示されます。
            </p>
            <ul class="qr-ar-guide-list">
                <li>参照: <code>third-party/QR_code_orientation_OpenCV</code></li>
                <li>原点: QR 左上、XY 平面、Z は面から垂直</li>
                <li>HTTPS 環境でカメラ許可が必要です</li>
            </ul>
            <button type="button" id="qr-ar-start-btn" class="qr-ar-start-btn">カメラを起動</button>
        </div>
    </div>
    <p id="qr-ar-status" class="qr-ar-status" role="status">準備完了</p>
    <div id="qr-ar-axes-mount" class="qr-ar-mount qr-ar-axes-mount" aria-hidden="true"></div>
    <script type="module" src="/addons/qr-ar/client/ar/axes-demo.js"></script>
</body>

</html>
